name: ACME PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: acme-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation-integrity:
    name: Foundation integrity
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      CI: 'true'
      QA_RUN: ci
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/qa/.local/browsers
    steps:
      - name: Check out the exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce allowed branch prefixes
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if ($env:PR_BRANCH -notmatch '^(feature|bugfix|chore)/.+$') {
            throw 'PR branch must start with feature/, bugfix/, or chore/.'
          }
      - name: Set up the project Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        working-directory: .
        run: |
          foreach ($package in @('frontend', 'backend', 'qa', 'tools/quality')) {
            npm --prefix $package ci --ignore-scripts --no-fund --no-audit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Enforce consistent source formatting
        working-directory: .
        run: |
          foreach ($package in @('frontend', 'backend', 'qa', 'tools/quality')) {
            npm --prefix $package run format:check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify quality hooks with disposable Git fixtures
        working-directory: tools/quality
        run: npm run test:quality-hooks
      - name: Initialize isolated synthetic PostgreSQL
        id: database
        run: npm run db:local:start
      - name: Verify migrations, unit tests, real database integrity and builds
        run: npm run verify:database
      - name: Verify independent React build and feature boundaries
        working-directory: frontend
        run: npm run quality:check
      - name: Verify Nest module wiring and shutdown order
        run: npm run test:architecture
      - name: Verify authentication persistence in isolated PostgreSQL
        run: npm run test:authentication
      - name: Verify team authorization and continuity in isolated PostgreSQL
        run: npm run test:team
      - name: Verify organization reference integrity in isolated PostgreSQL
        run: npm run test:references
      - name: Verify country and currency integrity
        run: npm run test:country-currency
      - name: Verify FX revisions and historical lookup
        run: npm run test:fx
      - name: Verify employee directory and privacy
        run: npm run test:employees
      - name: Verify independent employee linkage and HTTP protections
        run: npm run test:employee-linkage
      - name: Verify employee creation, salary approval and edit sessions
        run: npm run test:employee-workflow
      - name: Verify monthly salary and payroll approval through real HTTP and PostgreSQL
        run: npm run test:payroll-workflow
      - name: Verify built QA web server and API proxy
        working-directory: qa
        run: npm run test:qa-web
      - name: Type-check browser tests
        working-directory: qa
        run: npm run typecheck
      - name: Test Git staging safety with synthetic credentials
        working-directory: .
        run: node tools/quality/scripts/test-git-safety.mjs
      - name: Scan tracked source for prohibited runtime data and credentials
        working-directory: .
        run: node tools/quality/scripts/verify-staged.mjs
      - name: Install project-local Chromium
        working-directory: qa
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Test delivered foundation in Chromium
        working-directory: qa
        run: npm run test:foundation
      - name: Test SMTP login and logout in Chromium with an isolated database
        working-directory: qa
        run: npm run test:login
      - name: Retain foundation browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foundation-chromium-${{ github.event.pull_request.head.sha }}
          path: |
            qa/qa-artifacts/ci/
            qa/qa-artifacts/login/
            qa/qa-artifacts/references/
            qa/qa-artifacts/country-currency/
            qa/qa-artifacts/fx/
            qa/qa-artifacts/employees/
            qa/qa-artifacts/payroll/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated PostgreSQL
        if: always() && steps.database.outcome == 'success'
        run: npm run db:local:stop
